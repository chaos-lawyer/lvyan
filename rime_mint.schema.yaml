# Rime schema
# encoding: utf-8

schema:
  schema_id: rime_mint
  name: 薄荷拼音-全拼输入
  version: "24.11.11"
  icon: "zh.ico"
  ascii_icon: "en.ico"
  half_icon: "half.ico"
  full_icon: "full.ico"
  author:
    - mintimate < @Mintimate|https://www.mintimate.cn >
  description: |
    Mintimate的薄荷拼音方案。
    除了参考官方明月拼音，还参考：
      * chenhe: https://chenhe.me
      * rime wiki: https://github.com/rime/home/wiki
      * rime ice: https://github.com/iDvel/rime-ice
      * Chewing - 新酷音
      * opencc - 開放中文轉換
  dependencies:
    - radical_pinyin # 参考 https://github.com/mirtlecn/rime-radical-pinyin
    - stroke
    - melt_eng # 英文方案
    - english_abbr # 英文辅音简写棱镜（复用 melt_eng 词库源）
    
switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
  - name: emoji_suggestion
    states: [ "😣️","😁️"]
    reset: 1
  - name: emoji_mode_enabled
    states: [ 关闭, 开启 ]
    reset: 1
  - name: full_shape
    states: [ 半角, 全角 ]
    reset: 0
  - name: tone_display                  #开启后在输入编码的位置实时转换为带声调全拼，不开启则采用系统配置，影响的是preedit_format,归属：super_preedit.lua
    states: [ 声杳, 声起 ]
    reset: 0
  - name: transcription
    states: [ 简体 , 繁体 ]
    reset: 0
  - name: ascii_punct
    states: [ "。，" , "．，" ]
    reset: 0
    
engine:
  processors:
    - lua_processor@*tab_mode_hotkey              # Ctrl+Shift+A/Z/F/L/E/B：将当前全拼带入筛选模式
    - lua_processor@*candidate_detail_commit_processor # =：将当前侧窗详情正文直接上屏
    - lua_processor@*transcription_hotkey         # Ctrl+Shift+T：切换简繁并消费整个按键序列
    - lua_processor@*repeat_history_processor     # h+Tab 查看历史，i+Tab 重复上次上屏
    - lua_processor@*tab_prefix_processor         # Tab 引导功能前缀转换
    - lua_processor@*hot_slot_processor           # 固定候选宏上屏需先于数字选词处理器
    - lua_processor@*kp_number_processor
    - lua_processor@*select_character
    - lua_processor@*codeLengthLimit_processor     # 使用Lua限制输入内容的最大长度(防止过长而卡顿)
    - ascii_composer                               # ※ 處理西文模式及中西文切換
    - lua_processor@*date_select_processor         # 先处理模式选词，避免 recognizer 将 a~e 吞作编码
    - lua_processor@*lpr_select_processor          # LPR / V 模式 a~e 选词及运算符
    - recognizer                                   # ※ 與 matcher 搭配，處理符合特定規則的輸入碼，如網址、反查等
    - key_binder                                   # ※ 在特定條件下將按鍵綁定到其他按鍵，如重定義逗號、句號爲候選翻頁鍵
    - lua_processor@*law_select_processor          # d+数字模式下使用 a/b/c/d/e 选词
    - lua_processor@*anyou_processor               # 民事案由 A 模式动态竖排布局处理器
    - lua_processor@*zuiming_processor             # 刑法罪名 Z 模式动态竖排布局处理器
    - lua_processor@*fayuan_processor              # 全国人民法院 F 模式动态竖排布局处理器
    - lua_processor@*falv_processor               # 国家法律 G 模式动态竖排与候选详情处理器
    - lua_processor@*legal_search_processor       # 综合检索动态竖排与分类详情
    - lua_processor@*llm_trigger_processor        # 普通字母输入的 Tab AI 候选 fallback（全部特殊处理器之后）
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - affix_segmentor@english_filter
    - affix_segmentor@emoji
    - ascii_segmentor                                    # 標識西文段落
    - matcher                                            # 標識符合特定規則的段落，如網址、反查等
    # - affix_segmentor@wubi98_mint
    - affix_segmentor@radical_reverse_lookup
    - affix_segmentor@stroke
    - affix_segmentor@unicode
    - abc_segmentor                                      # 標識常規的文字段落
    - punct_segmentor                                    # 標識句讀段落
    - fallback_segmentor                                 # 標識其他未標識段落
  translators:
    - table_translator@english_filter
    - lua_translator@*emoji_initial_translator
    - lua_translator@*repeat_history_translator   # h+Tab 历史候选
    - script_translator@emoji
    - punct_translator                                   # ※ 轉換標點符號
    - script_translator
    - lua_translator@*unicode_translator                # Unicode 编码候选
    - lua_translator@*shijian                            # 时间、日期、星期、月份、问候、节气、节日，N模式
    - lua_translator@*number_translator                  # 金额大小写
    - lua_translator@*chineseLunarCalendar_translator    # 农历
    - lua_translator@*v_expression_translator            # v+Tab 数字大写、金额转换与计算器
    - lua_translator@*lpr                                # LPR 查询与自动更新（lpr+Tab 触发）
    - lua_translator@*anyou                              # 民事案由筛选（a+Tab 触发）
    - lua_translator@*zuiming                            # 刑法罪名筛选（z+Tab 触发）
    - lua_translator@*legal_search_translator           # 法院/案由/罪名/法律综合检索（f+Tab）
    - lua_translator@*fayuan                             # 全国人民法院筛选（f+Tab 触发）
    - lua_translator@*falv                              # 国家法律文件检索（l+Tab 触发）
    - lua_translator@*date_calculator                    # 日期计算（r+Tab 触发）
    - lua_translator@*fenshu_translator                   # 文本份数（ys/yu+Tab 触发）
    - table_translator@melt_eng                          # 英文输入（作为子翻译器，优先级需要比原生的低）
    - table_translator@cn_en                             # 中英混合词汇
    - reverse_lookup_translator@radical_reverse_lookup
    # - reverse_lookup_translator@wubi98_mint
    - reverse_lookup_translator@stroke
    - lua_translator@*force_gc
    # - reverse_lookup_translator                   # 反查模块，多标签情况下去除
    # - echo_translator                             # ※ 没有候选词，返回字符
  filters:
    - lua_filter@*english_mode_filter
    - simplifier@emoji_mode
    - lua_filter@*emoji_only_filter
    - lua_filter@*corrector_filter               # 错音错字提示
    - lua_filter@*super_preedit                  # 输入码显示全拼并带上音调
    - lua_filter@*autocap_filter                 # 英文自动大写
    - lua_filter@*hot_slot_filter                # 全拼个人词库固定候选位与热加载滤镜（位于简繁转换前）
    - simplifier@emoji_suggestion
    - simplifier@transcription_cc
    - lua_filter@*reduce_english_filter          # 将部分英文候选调整到指定位置
    - uniquifier                                 # 去重

# LLM Tab fallback。密钥只从用户环境变量读取，不放入方案文件。
llm:
  enabled: true
  base_url: ""
  api_key_env: "WEASEL_LLM_API_KEY"
  model: ""
  input_scheme: auto
  context_enabled: true
  context_chars: 500
  boundary_search_chars: 100
  candidate_count: 5
  timeout_ms: 3000
  ai_comment:
    enabled: true
    text: "✦ AI"
  cache:
    enabled: true
    ttl_seconds: 300
    max_entries: 500
  debug_log_context: false

#shijian:仅仅作为提示使用，编码已经写死，引导键可以在key_binder下修改前缀
#时间：osj 或者 /sj
#日期：orq 或者 /rq
#农历：onl 或者 /nl
#星期：oxq 或者 /xq
#今年第几周：oww 或者 /ww
#节气：ojq 或者 /jq
#日期+时间：odt 或者 /dt
#时间戳：ott 或者 /tt
#大写N日期：N20250315 或者N0312不带年
#节日：ojr 或者 /jr
#问候模板：/day 或者 oday
# 通用日期时间格式化函数（供 /rq、/sj、/dt、N0101、N20150101 场景复用）
# 支持转义：
#   \X       —— 转义单个字符 X，按字面量输出（如 \Y \m \H 等）
#   [[...]]  —— 区块整体按字面量输出
#
# 约定占位符：
# 【日期】
#   Y  四位年份           0000-9999  例：2025
#   y  两位年份           00-99      例：25
#   m  月（前导零）        01-12      例：02
#   n  月（不带前导零）     1-12       例：2
#   d  日（前导零）        01-31      例：09
#   j  日（不带前导零）     1-31       例：9
#
# 【时间】
#   H  24小时（前导零）   00-23      例：08
#   G  24小时（不带零）   0-23       例：8
#   I  12小时（前导零）   01-12      例：08
#   l  12小时（不带零）   1-12       例：8   （注意是小写 L）
#   M  分钟（前导零）     00-59      例：05
#   S  秒（前导零）       00-59      例：09
#   p  am/pm（小写）     am / pm
#   P  AM/PM（大写）     AM / PM
# 【时区】
#   O  带冒号格式        +08:00、-04:30、+05:45
#   o  不带冒号格式      +0800、-0430、+0545
#   A  中文时段    凌晨 / 上午 / 中午 / 下午 / 晚上
date_formats:
  - "Y年m月d日"
  - "Y-m-d"
  - "Y/m/d"
  - "Y.m.d"
  - "Ymd"
  - "Y年n月j日"
  - "y年n月j日"
  - "n月j日"
time_formats:
  - "H:M"
  - "H点M分"
  - "H:M:S"
  - "H时M分S秒"
  - "AI:M"
  - "I:M P"
datetime_formats:
  - "Y-m-d H:M:S"
  - "Y-m-dTH:M:S O"
  - "YmdHMS"
  - "Y年m月d日 H点M分"
  - "y/m/d I:M p"

# 简繁切换
transcription_cc:
  option_name: transcription
  opencc_config: s2t.json             # s2t.json | s2hk.json | s2tw.json | s2twp.json
  tips: none                          # 转换提示: all 都显示 | char 仅单字显示 | none 不显示。
  excluded_types: [ reverse_lookup ]  # 不转换反查（两分拼字）的内容

# 最大输入长度
codeLengthLimit_processor: 25

# Emoji模块
emoji_suggestion:
  opencc_config: emoji.json
  option_name: emoji_suggestion
  tips: all
  inherit_comment: false

emoji_mode:
  opencc_config: emoji.json
  option_name: emoji_mode_enabled
  tags: [emoji]
  tips: all
  inherit_comment: false

emoji:
  tag: emoji
  dictionary: rime_mint
  enable_user_dict: false
  enable_sentence: false
  prefix: "B"
  tips: 〔Emoji表情〕

# Lua 配置: 将部分英文候选调整到指定位置。
# 详细介绍 https://dvel.me/posts/make-rime-en-better/#短单词置顶的问题
# 万象高词频下，英文可能被压到较后位置
# 调整后：命中的英文会移到 idx 指定的候选位
# 几种模式：
# all     使用 reduce_english_filter 自带的候选位词库（调整所有 3~4 位长度、前 2~3 位是完整拼音、最后一位是声母的单词）
# none    不调整任何单词，相当于没有启用这个 Lua
# custom  自定义，只调整 words 里的
# 『留白』 不设置该选项，使用 reduce_english_filter 内全局设置内容
# （匹配的是编码，不是单词）
reduce_english_filter:
  mode: all  # all | none | custom | 『留白』
  idx: 2        # 调整到第 idx 个位置
  # 自定义的单词列表，示例列表没有调整部分常用单词，如 and cat mail Mac but bad shit ……
  words: [aid, ann,
  bail, bait, bam, band, bans, bat, bay, bend, bent, benz, bib, bid, bien, biz, boc, bop, bos, bud, buf,
  cab, cad, cain, cam, cans, cap, cas, cef, chad, chan, chap, chef, cher, chew, chic, chin, chip, chit, coup, cum, cunt, cur,
  dab, dag, dal, dam, dent, dew, dial, diet, dim, din, dip, dis, dit, doug, dub, dug, dunn,
  fab, fax, fob, fog, foul, fur,
  gag, gail, gain, gal, gam, gaol, ged, gel, ger, guam, gus, gut,
  hail, ham, hank, hans, hat, hay, heil, heir, hem, hep, hud, hum, hung, hunk, hut,
  jim, jug,
  kat,
  lab, lad, lag, laid, lam, laos, lap, lat, lax, lay, led, leg, lex, liam, lib, lid, lied, lien, lies, linn, lip, lit, liz, lob, lug, lund, lung, lux,
  mag, maid, mann, mar, mat, med, mel, mend, mens, ment, mil, mins, mint, mob, moc, mop, mos, mot, mud, mug, mum, nail,
  nap, nat, nay, neil, nib, nip, noun, nous, nun, nut,
  pac, paid, pail, pain, pair, pak, pal, pam, pans, pant, pap, par, pat, paw, pax, pens, pic, pier, pies, pins, pint, pit, pix, pod, pop, pos, pot, pour, pow, pub,
  rand, rant, rent, rep, res, ret, rex, rib, rid, rig, rim, rub, rug, rum, runc, runs,
  sac, sail, sal, sam, sans, sap, saw, sax, sew, sham, shaw, shin, sig, sin, sip, sis, suit, sung, suns, sup, sur, sus,
  tad, tail, taj, tar, tax, tec, ted, tel, ter, tex, tic, tied, tier, ties, tim, tin, tit, tour, tout, tum,
  wag, wand, womens, wap, wax, weir, won,
  yan, yen]
  
  
# 中国农历配置
chineseLunarCalendar_translator: lunar


translator:
  # enable_correction: true      # Rime自带的按键纠错，适用于手机26键 参考: https://github.com/rime/librime/pull/228
  # 字典文件
  dictionary: rime_mint          # 使用的字典文件
  enable_word_completion: true   # 大于 4 音节的词条自动补全，librime > 1.11.2
  spelling_hints: 8              # corrector.lua ：为了让错音错字提示的 Lua 同时适配全拼双拼，将拼音显示在 comment 中
  always_show_comments: true     # corrector.lua ：Rime 默认在 preedit 等于 comment 时取消显示 comment，这里强制一直显示，供 corrector.lua 做判断用。
  comment_format: {comment}      # 将注释以词典字符串形式完全暴露，通过super_preedit.lua完全接管，灵活配置。
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
  initial_quality: 1.2
  # 学习仅作用于普通 script_translator 候选；不改变方案、固定候选和功能模式的优先级。
  enable_user_dict: true         # 记录已选词的词频并用于后续调频
  enable_encoder: true           # 将连续上屏的词语自动编码，形成可复用的用户词
  enable_sentence: true          # 允许普通输入的组句候选参与学习
  encode_commit_history: true    # 将上屏历史写入用户词典，供后续候选命中

# 全拼固定候选位与热加载配置
hot_slot_filter:
  file: dicts/quanpin/custom_hot_slot.txt
  check_interval: 1
  deduplicate: true
  enable_comments: false

melt_eng:
  dictionary: melt_eng           # 英文词典
  enable_sentence: false         # 关闭自动造句
  enable_completion: false       # 关闭自动提示
  initial_quality: 1.0
  comment_format:                # 自定义提示码
    - xform/.*//                 # 清空提示码

cn_en:
  dictionary: ""                 # 中英混输，直接使用短语词典，普通字典直接留空即可
  user_dict: dicts/rime_ice.cn_en
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 0.5
  comment_format:
    - xform/^.+$//
speller:
  # 如果不想让什么标点直接上屏，可以加在 alphabet，或者编辑标点符号为两个及以上的映射；默认没用大写字母，使用大写字母方便中英混熟词典生效
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  # 第一位 「空格」是拼音之间的默认分隔符；第二位「`」表示可以手动输入单引号来分割拼音
  delimiter: " `"
  # 拼写匹配
  algebra:
    - xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜü/aaaaooooeeeeiiiiuuuuvvvvv/  # 万象词库 Start
    - xform/^ng$/eng/
    - xform/ńg|ňg|ǹg/eng/
    - xform/ń|ň|ǹ/en/                                            # 万象词库 End
    - erase/^xx$/ # 首选保留
    # - derive/^([zcs])h/$1/ # zh, ch, sh => z, c, s
    # - derive/^([zcs])([^h])/$1h$2/ # z, c, s => zh, ch, sh
    # - derive/([aei])n$/$1ng/ # an => ang, en => eng, in => ing
    # - derive/([aei])ng$/$1n/ # ang => an, eng => en, ing => in
    # - derive/([iu])an$/$lan/ # ian => iang, uan => uang
    # - derive/([iu])ang$/$lan/ # iang => ian, uang => uan
    - derive/([aeiou])ng$/$1gn/        # dagn => dang
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/  # zho => zhong|zhou
    - derive/ong$/on/                  # zhonguo => zhong guo
    - derive/un$/ong/                  # yuntong = yongtong
    ## 简拼
    - derive/^([zcs]h).+$/$1/        # 特别处理 zh, ch, sh 的首字母简写
    - abbrev/^([a-z]).+$/$1/         # 允许使用首字母作为缩写
    # 简拼: 允许使用前两个字母作为缩写
    # - abbrev/^([a-z]{2,}).+$/$1/     # zem -> zen me -> 怎么
     ### 自动纠错
    # 有些规则对全拼简拼混输有副作用：如「x'ai 喜爱」被纠错为「xia 下」
    # zh、ch、sh
    - derive/([zcs])h(a|e|i|u|ai|ei|an|en|ou|uo|ua|un|ui|uan|uai|uang|ang|eng|ong)$/h$1$2/  # hzi → zhi
    - derive/([zcs])h([aeiu])$/$1$2h/  # zih → zhi
    # ai
    - derive/^([wghk])ai$/$1ia/  # wia → wai
    # ia
    - derive/([qjx])ia$/$1ai/  # qai → qia
    # ei
    - derive/([wtfghkz])ei$/$1ie/
    # ie
    - derive/([jqx])ie$/$1ei/
    # ao
    - derive/([rtypsdghklzcbnm])ao$/$1oa/
    # ou
    - derive/([ypfm])ou$/$1uo/
    # uo（无）
    # an
    - derive/([wrtypsdfghklzcbnm])an$/$1na/
    # en
    - derive/([wrpsdfghklzcbnm])en$/$1ne/
    # ang
    - derive/([wrtypsdfghklzcbnm])ang$/$1nag/
    - derive/([wrtypsdfghklzcbnm])ang$/$1agn/
    # eng
    - derive/([wrtpsdfghklzcbnm])eng$/$1neg/
    - derive/([wrtpsdfghklzcbnm])eng$/$1egn/
    # ing
    - derive/([qtypdjlxbnm])ing$/$1nig/
    - derive/([qtypdjlxbnm])ing$/$1ign/
    # ong
    - derive/([rtysdghklzcn])ong$/$1nog/
    - derive/([rtysdghklzcn])ong$/$1ogn/
    # iao
    - derive/([qtpdjlxbnm])iao$/$1ioa/
    - derive/([qtpdjlxbnm])iao$/$1oia/
    # ui
    - derive/([rtsghkzc])ui$/$1iu/
    # iu
    - derive/([qjlxnm])iu$/$1ui/
    # ian
    - derive/([qtpdjlxbnm])ian$/$1ain/
    # - derive/([qtpdjlxbnm])ian$/$1ina/ # 和「李娜、蒂娜、缉拿」等常用词有冲突
    # in
    - derive/([qypjlxbnm])in$/$1ni/
    # iang
    - derive/([qjlxn])iang$/$1aing/
    - derive/([qjlxn])iang$/$1inag/
    # ua
    - derive/([g|k|h|zh|sh])ua$/$1au/
    # uai
    - derive/([g|h|k|zh|ch|sh])uai$/$1aui/
    - derive/([g|h|k|zh|ch|sh])uai$/$1uia/
    # uan
    - derive/([qrtysdghjklzxcn])uan$/$1aun/
    # - derive/([qrtysdghjklzxcn])uan$/$1una/ # 和「去哪、露娜」等常用词有冲突
    # un
    - derive/([qrtysdghjklzxc])un$/$1nu/
    # ue
    - derive/([nlyjqx])ue$/$1eu/
    # uang
    - derive/([g|h|k|zh|ch|sh])uang$/$1aung/
    - derive/([g|h|k|zh|ch|sh])uang$/$1uagn/
    - derive/([g|h|k|zh|ch|sh])uang$/$1unag/
    - derive/([g|h|k|zh|ch|sh])uang$/$1augn/
    # iong
    - derive/([jqx])iong$/$1inog/
    - derive/([jqx])iong$/$1oing/
    - derive/([jqx])iong$/$1iogn/
    - derive/([jqx])iong$/$1oign/
    # 其他
    - derive/([rtsdghkzc])o(u|ng)$/$1o/ # do → dou|dong
    - derive/ong$/on/ # lon → long
    - derive/([tl])eng$/$1en/ # ten → teng
    - derive/([qwrtypsdfghjklzxcbnm])([aeio])ng$/$1ng/ # lng → lang、leng、ling、long
    - derive/un$/ong/                  # yuntong = yongtong

# wubi98_mint:
#   tag: wubi98_mint
#   dictionary: wubi98_mint
#   enable_user_dict: false
#   enable_completion: true
#   prefix: "Uw"
#   tips: 〔五笔〕
  
stroke:
  tag: stroke
  dictionary: stroke
  enable_user_dict: false
  prefix: 'Ui'
  tips: 〔笔画〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/
    
radical_reverse_lookup:
  tag: radical_lookup
  dictionary: radical_pinyin
  enable_completion: false
  enable_sentence: false
  prefix: "Uu"
    # comment_format:
  #   - erase/^.*$// # 删除注释
  tips: 〔拆字〕

unicode:
  tag: unicode
  prefix: "Uc"
  tips: 〔Unicode〕
  
reverse_lookup:
  tags: [stroke,radical_lookup]
  overwrite_comment: true
  dictionary: rime_mint
  
punctuator:
  import_preset: symbols
  full_shape:
    "=": { commit: "=" }
    "/": { commit: "、" }
    '\': { commit: "、" }
    "|": { commit: "|" }
    "'": { pair: [ '“', '”' ] }
    '"': { pair: [ '‘', '’' ] }
    "[": { commit: "【" }
    "]": { commit: "】" }
    "<": { commit: "《" }
    ">": { commit: "》" }
  # 定义部分半角字符
  half_shape:
      "#": "#"
      "*": "*"
      '.' : { commit: 。 }
      "`": "`"
      "~": "~"
      "@": "@"
      "=": { commit: "=" }
      "/": { commit: "、" }
      '\': { commit: "、" }
      "_" : "──"
      "'": { pair: [ '“', '”' ] }
      '"': { pair: [ '‘', '’' ] }
      "[": { commit: "【" }
      "]": { commit: "】" }
      "$": ["¥", "$", "€", "£", "¢", "¤"]
      "<": { commit: "《" }
      ">": { commit: "》" }
    
# 反查映射
recognizer:
  import_preset: default
  patterns:
    emoji: "^B[a-z]*'?$"
    unicode: "^Uc[a-z]*'?$"
    english_filter: "^E[a-z]*$"
    url: "^[a-z]+[.].+$"
    punct: "^/([0-9]0?|[a-zA-Z]+)$"
    # wubi98_mint: "Uw[a-z]*'?$"
    stroke: "Ui[a-z]*'?$"
    radical_lookup: "Uu[a-z]*'?$"
    history: "^H$"                               # h+Tab 输入历史候选
    calc_or_number: "^V.*$"          # 响应 lua_translator@v_expression_translator（v+Tab 触发）
    date_calc: "^R.*$"               # 响应 lua_translator@date_calculator（r+Tab 触发）
    rmb: "^[Rr][0-9]+[.]?[0-9]*"     # 金额数字：r12（兼容 R12）
    law_article: "^[Dd][0-9]+[.]?[0-9]*[.]?[0-9]*$"  # d12、d12.3、d12.3.1、d12..1
    law_unit: "^[Dd][0-9]+([vjkxytz]|zh)$"            # 章(v/z/zh)、节(j)、款(k)、项(x)、页(y)、条(t)
    # expression: "^=.*$"              # 已关闭 = 引导表达式计算，保证 = 直接输出              # 响应 lua_translator@expression_translator 脚本将自动获取第 2 个字符作为触发前缀
    gregorian_to_lunar: "^N[0-9]{1,8}"  # 响应 lua_translator@Chinese_lunar_calendar 公历转农历，输入 N20240115 得到「二〇二四年腊月初五」，脚本将自动获取第 2 个字符作为触发前缀
    lpr: "^L.*$"                     # 响应 lua_translator@lpr（lpr+Tab 触发）
    anyou: "^A.*$"                   # 响应 lua_translator@anyou（a+Tab 触发）
    zuiming: "^Z.*$"                 # 响应 lua_translator@zuiming（z+Tab 触发）
    fayuan: "^F.*$"                  # 响应 lua_translator@fayuan（f+Tab 触发）
    falv: "^G.*$"                   # 响应 lua_translator@falv（l+Tab 触发）
    fenshu: "^Ys.*$"                 # 响应 lua_translator@fenshu_translator（ys/yu+Tab 触发）
    uppercase: ""  # 覆写默认的 uppercase 使其可以在输入大写后，输入数字

anyou:
  pinyin_type: quanpin

zuiming:
  pinyin_type: quanpin

fayuan:
  pinyin_type: quanpin

legal_search:
  pinyin_type: quanpin

falv:
  pinyin_type: quanpin
  detail_width: 360                 # 法律查询侧窗；未设置的模式继续使用全局宽度

english_filter:
  tag: english_filter
  dictionary: english_abbr
  enable_sentence: false
  enable_completion: true
  enable_user_dict: false
  initial_quality: 2.0
  prefix: "E"
  tips: 〔英文辅音简写〕

history:
  tag: history
  tips: 〔输入历史〕

# Tab 功能模式开关。enabled 为总开关；其余键对应实际输入的触发码。
# 在 *.custom.yaml 中覆盖为 false 即可关闭，无需删除处理器或翻译器。
tab_mode_switches:
  enabled: true
  english: true # e + Tab / Ctrl+Shift+E 英文补全
  e: true       # 兼容旧配置；英文模式由 english 开关控制
  f: true       # f + Tab / Ctrl+Shift+F 法律综合检索
  v: true       # v + Tab 或 V 数字、金额、计算器
  history: true  # h/i + Tab 输入历史与重复上次输出
  b: true       # Emoji 的 b + Tab 入口
  l: false      # 关闭 l + Tab 旧入口
  z: false      # 关闭 z + Tab 罪名入口
  a: false      # 关闭 a/ay + Tab 案由入口
  lpr: false    # 关闭 l/lpr + Tab LPR 入口
  r: false      # 关闭 r/rq + Tab 日期入口
  rf: false     # 关闭 rf + Tab 法定顺延入口
  u: true       # u + Tab 拆字入口
  ys: false     # 关闭 ys/yu + Tab 文本份数入口

# 候选窗默认显示实际键入的触发码；如需自定义，可按触发码覆盖：
# tab_mode_display:
#   l: law
#   z: crime


key_binder:
  import_preset: default
  # Lua 配置: shijian.lua 的引导符，涉及：日期、时间、节日、节气、生日、问候模板等功能
  shijian_keys: ["o"]
  bindings:
    - {accept: "Control+Shift+1", toggle: transcription, when: has_menu}           # 当存在候选菜单时，可以切换简体和繁体
    - {accept: "Control+Shift+exclam", toggle: transcription, when: has_menu}      # 当存在候选菜单时，可以切换简体和繁体（小狼毫可能读取这个）


menu:
  # 候选词个数
  page_size: 6

# Rime schema
# encoding: utf-8

# 适配了双拼
# 双拼键位映射复制自 https://github.com/rime/rime-double-pinyin
# 双拼之间主要就是 speller/algebra 和 translator/preedit_format 这里有区别。

# 方案说明
schema:
  schema_id: double_pinyin_flypy
  name: "小鹤双拼-薄荷定制"
  version: "24.10.03"
  icon: "zh.ico"
  ascii_icon: "en.ico"
  half_icon: "half.ico"
  full_icon: "full.ico"
  author:
    - Mintimate
  description: |
    Mintimate的薄荷小鹤双拼方案。
    除了参考官方小鹤双拼，还参考：
      * chenhe: https://chenhe.me
      * rime wiki: https://github.com/rime/home/wiki
      * rime ice: https://github.com/iDvel/rime-ice
      * Chewing - 新酷音
      * opencc - 開放中文轉換
  dependencies:
    - name_corpus            # 人名词库依赖
    - radical_pinyin_flypy    # 参考 https://github.com/mirtlecn/rime-radical-pinyin
    - stroke
    - melt_eng          # 英文方案
    - english_abbr      # 英文辅音简写棱镜（复用 melt_eng 词库源）

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
  - name: name_mode
    reset: 0
    states: [ 普通, 人名 ]
  # 专属 Emoji 滤镜固定开启，由 emoji 标签限定作用范围。
  - name: emoji_mode_enabled
    reset: 1
    states: [ 关闭, 开启 ]
  - name: full_shape
    states: [ 半角, 全角 ]
    reset: 0
  - name: tone_display                  #开启后在输入编码的位置实时转换为带声调全拼，不开启则采用系统配置，影响的是preedit_format,归属：super_preedit.lua
    states: [ 声杳, 声起 ]
    reset: 0
  - name: transcription
    states: [ 简体 , 繁体 ]
    reset: 0
  - name: ascii_punct
    states: [ "。，", "．，" ]
    reset: 0
  - name: chaifen        # 拆字滤镜
    states: [ 🙈, 🐵 ]     # 快捷键 「Control+Shift+C」
    reset: 0

engine:
  processors:
    - lua_processor@*tab_mode_hotkey              # Ctrl+Shift+A/Z/F/L/E/B：将当前双拼带入筛选模式
    - lua_processor@*candidate_detail_commit_processor # =：将当前侧窗详情正文直接上屏
    - lua_processor@*transcription_hotkey        # Ctrl+Shift+T：切换简繁并消费整个按键序列
    - lua_processor@*name_mode_hotkey            # Ctrl+Shift+M：切换人名模式并消费整个按键序列
    - lua_processor@*auto_update_processor        # 普通输入期间低频维护 LPR 与节假日数据
    - lua_processor@*repeat_history_processor     # 输入历史 (h+Tab) 与 重复上次输出 (i+Tab)
    - lua_processor@*aux_phrase_history_processor # 逐字辅码选词后，学习为基础双拼词组
    - lua_processor@*tab_prefix_processor         # Tab 引导功能前缀转换（e表情 / u拆字 / r日期 / l利率）
    - lua_processor@*hot_slot_processor           # 固定候选宏上屏需先于数字选词处理器
    - lua_processor@*kp_number_processor           # 功能前缀后数字参与编码；其他场景仍用于选词
    - lua_processor@*select_character              # 以词定字
    - lua_processor@*codeLengthLimit_processor     # 使用Lua限制输入内容的最大长度(防止过长而卡顿)
    - ascii_composer                               # ※ 處理西文模式及中西文切換
    - lua_processor@*date_select_processor         # 先处理模式选词，避免 recognizer 将 a~e 吞作编码
    - lua_processor@*lpr_select_processor          # LPR / V 模式 a~e 选词及运算符
    - recognizer                                   # ※ 與 matcher 搭配，處理符合特定規則的輸入碼，如網址、反查等
    - key_binder                                   # ※ 在特定條件下將按鍵綁定到其他按鍵，如重定義逗號、句號爲候選翻頁鍵
    - lua_processor@*law_select_processor          # d+数字模式下使用 a/b/c/d/e 选词
    - lua_processor@*anyou_processor               # 民事案由 A 模式动态竖排布局处理器
    - lua_processor@*zuiming_processor             # 刑法罪名 Z 模式动态竖排布局处理器
    - lua_processor@*fayuan_processor              # 全国人民法院 F 模式动态竖排布局处理器
    - lua_processor@*falv_processor               # 国家法律 G 模式动态竖排与候选详情处理器
    - lua_processor@*legal_search_processor       # 综合检索动态竖排与分类详情
    - lua_processor@*llm_trigger_processor        # 普通字母输入的 Tab AI 候选 fallback（全部特殊处理器之后）
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor                                    # 標識西文段落
    - matcher                                            # 標識符合特定規則的段落，如網址、反查等
    - affix_segmentor@emoji                              # b+Tab / Ctrl+Shift+B 引导 Emoji 模式
    - affix_segmentor@english_filter                     # e+Tab / Ctrl+Shift+E 英文简写模式（E 前缀）
    # - affix_segmentor@wubi98_mint
    - affix_segmentor@radical_reverse_lookup
    # - affix_segmentor@stroke
    # - affix_segmentor@unicode
    - abc_segmentor                                      # 標識常規的文字段落
    - punct_segmentor                                    # 標識句讀段落
    - fallback_segmentor                                 # 標識其他未標識段落
  translators:
    - punct_translator                                   # ※ 轉換標點符號
    - lua_translator@*name_translator                    # 人名模式专用翻译器
    - lua_translator@*repeat_history_translator         # 输入历史候选（h+Tab 触发）
    - lua_translator@*aux_phrase_history_translator     # 逐字辅码学习的基础双拼词组
    - lua_translator@*emoji_initial_translator          # Emoji 表情的小鹤首拼：uuji -> uj
    - script_translator
    - script_translator@emoji
    # - lua_translator@*unicode_translator                # Unicode 编码候选
    # - lua_translator@*shijian                            # 时间、日期、星期、月份、问候、节气、节日，N模式（已禁用，统一由大写R接管）
    - lua_translator@*number_translator                  # 金额大小写
    - lua_translator@*v_expression_translator            # v+Tab 数字大写、金额转换与计算器
    - lua_translator@*lpr                                # LPR 查询与自动更新（lpr+Tab 触发）
    - lua_translator@*anyou                              # 民事案由筛选（a+Tab 触发）
    - lua_translator@*zuiming                            # 刑法罪名筛选（z+Tab 触发）
    - lua_translator@*legal_search_translator           # 法院/案由/罪名/法律综合检索（f+Tab）
    - lua_translator@*fayuan                             # 全国人民法院筛选（f+Tab 触发）
    - lua_translator@*falv                              # 国家法律文件检索（l+Tab 触发）
    # - lua_translator@*chineseLunarCalendar_translator    # 农历（已禁用，统一由大写R接管）
    # - lua_translator@*mint_calculator_translator         # 原薄荷计算器（已由 v_expression_translator 接管）
    - table_translator@melt_eng                          # 英文输入（作为子翻译器，优先级需要比原生的低）
    - table_translator@english_filter                    # Ctrl+Shift+E 英文前缀补全
    - table_translator@cn_en                             # 中英混合词汇
    - reverse_lookup_translator@radical_reverse_lookup
    # - reverse_lookup_translator@wubi98_mint
    # - reverse_lookup_translator@stroke
    - lua_translator@*force_gc                           # 暴力GC，尝试解决小狼毫长期使用的卡顿
    - lua_translator@*date_calculator                    # 日期计算（r+Tab 触发）
    - lua_translator@*fenshu_translator                   # 文本份数（ys/yu+Tab 触发）
  filters:
    - lua_filter@*direct_aux                  # 先生成消费完整辅码的筛选词，再统一做拼音显示、简繁转换
    - lua_filter@*corrector_filter            # 错音错字提示
    - lua_filter@*super_preedit               # 输入码显示全拼并带上音调
    - lua_filter@*autocap_filter              # 英文自动大写
    - lua_filter@*english_mode_filter          # 英文模式仅显示英文补全候选
    - lua_filter@*single_char_first_filter    # 两键双拼优先单个汉字
    - simplifier@emoji_mode                   # Emoji 表情模式滤镜
    - lua_filter@*emoji_only_filter           # Emoji 表情模式仅保留表情候选
    - lua_filter@*hot_slot_filter             # 手心小鹤个人词库固定候选位与热加载滤镜（位于简繁转换前）
    - simplifier@transcription_cc
    - simplifier@chaifen_cc                   # 鹤形拆字辅助滤镜
    - lua_filter@*aux_code_filter@flypy_full   # 小鹤双拼辅码(音形)
    - lua_filter@*reduce_english_filter       # 将部分英文候选调整到指定位置
    - lua_filter@*name_filter                 # 人名模式候选过滤
    - uniquifier                              # 去重

# LLM Tab fallback。密钥只从用户环境变量读取，不放入方案文件。
llm:
  enabled: true
  base_url: ""
  api_key_env: "WEASEL_LLM_API_KEY"
  model: ""
  input_scheme: auto
  context_enabled: true
  context_chars: 500
  boundary_search_chars: 100
  candidate_count: 5
  timeout_ms: 3000
  ai_comment:
    enabled: true
    text: "✦ AI"
  cache:
    enabled: true
    ttl_seconds: 300
    max_entries: 500
  debug_log_context: false

# 原薄荷输入法内置触发方式已全部禁用（统一由大写 R 模式接管）：
# - 时间：osj 或者 /sj
# - 日期：orq 或者 /rq
# - 农历：onl 或者 /nl
# - 星期：oxq 或者 /xq
# - 今年第几周：oww 或者 /ww
# - 节气：ojq 或者 /jq
# - 日期+时间：odt 或者 /dt
# - 时间戳：ott 或者 /tt
# - 大写N日期：N20250315 或者 N0312不带年
# - 节日：ojr 或者 /jr
# - 问候模板：/day 或者 oday
# 通用日期时间格式化函数（供 /rq、/sj、/dt、N0101、N20150101 场景复用）
# 支持转义：
#   \X       —— 转义单个字符 X，按字面量输出（如 \Y \m \H 等）
#   [[...]]  —— 区块整体按字面量输出
#
# 约定占位符：
# 【日期】
#   Y  四位年份           0000-9999  例：2025
#   y  两位年份           00-99      例：25
#   m  月（前导零）        01-12      例：02
#   n  月（不带前导零）     1-12       例：2
#   d  日（前导零）        01-31      例：09
#   j  日（不带前导零）     1-31       例：9
#
# 【时间】
#   H  24小时（前导零）   00-23      例：08
#   G  24小时（不带零）   0-23       例：8
#   I  12小时（前导零）   01-12      例：08
#   l  12小时（不带零）   1-12       例：8   （注意是小写 L）
#   M  分钟（前导零）     00-59      例：05
#   S  秒（前导零）       00-59      例：09
#   p  am/pm（小写）     am / pm
#   P  AM/PM（大写）     AM / PM
# 【时区】
#   O  带冒号格式        +08:00、-04:30、+05:45
#   o  不带冒号格式      +0800、-0430、+0545
#   A  中文时段    凌晨 / 上午 / 中午 / 下午 / 晚上
date_formats:
  - "Y年m月d日"
  - "Y-m-d"
  - "Y/m/d"
  - "Y.m.d"
  - "Ymd"
  - "Y年n月j日"
  - "y年n月j日"
  - "n月j日"
time_formats:
  - "H:M"
  - "H点M分"
  - "H:M:S"
  - "H时M分S秒"
  - "AI:M"
  - "I:M P"
datetime_formats:
  - "Y-m-d H:M:S"
  - "Y-m-dTH:M:S O"
  - "YmdHMS"
  - "Y年m月d日 H点M分"
  - "y/m/d I:M p"

# 简繁切换
transcription_cc:
  option_name: transcription
  opencc_config: s2t.json             # s2t.json | s2hk.json | s2tw.json | s2twp.json
  tips: none                          # 转换提示: all 都显示 | char 仅单字显示 | none 不显示。
  excluded_types: [ reverse_lookup ]  # 不转换反查（两分拼字）的内容

# Emoji模块
# 2. b+Tab / Ctrl+Shift+B 引导的 Emoji 专属滤镜（内部 B 前缀）
emoji_mode:
  opencc_config: emoji.json
  option_name: emoji_mode_enabled
  tags: [emoji]
  tips: all
  inherit_comment: false

# Emoji 模式分词器配置（内部 B 前缀）
emoji:
  tag: emoji
  dictionary: rime_mint
  prism: double_pinyin_flypy
  enable_user_dict: false
  enable_sentence: false
  prefix: "B"
  tips: 〔Emoji表情〕

english_filter:
  tag: english_filter
  dictionary: english_abbr
  enable_sentence: false
  enable_completion: true
  enable_user_dict: false
  initial_quality: 2.0
  prefix: "E"
  tips: 〔英文辅音简写〕
# 鹤形拆字辅助滤镜
chaifen_cc:
  opencc_config: fly_Chaifen.json
  option_name: chaifen
  show_in_comment: true  # 是否仅将转换结果显示在备注中
  comment_format:
    - "xform/&nbsp;/ /"
  tags:                  # 设置其作用范围
    - abc
    - storkfly
    - reverse_lookup
  tips: char             #  单字加滤镜: char; 全部: all，

 # 最大输入长度
codeLengthLimit_processor: 25


# 小鹤音形配置
aux_code:
  # 激活码
  trigger_word: ";"
  # 展示辅码的模式
  # always:   总是展示(默认)
  # trigger:  输入激活码后激活辅码
  # none:     始终不展示辅码
  show_aux_notice: "trigger"

# 小鹤双拼直接辅助码配置（无触发键，首字匹配）
direct_aux:
  enabled: true
  translators: [script_translator]
  max_candidates: 256           # 每个词库最多检查的基础候选数，不截断后续组句候选
  word_match: first
  max_aux_length: 2
  match_mode: prefix
  candidate_mode: promote
  fallback: normal_input
  show_aux_comment: false



# Lua 配置: 将部分英文候选调整到指定位置。
# 详细介绍 https://dvel.me/posts/make-rime-en-better/#短单词置顶的问题
# 万象高词频下，英文可能被压到较后位置
# 调整后：命中的英文会移到 idx 指定的候选位
# 几种模式：
# all     使用 reduce_english_filter 自带的候选位词库（调整所有 3~4 位长度、前 2~3 位是完整拼音、最后一位是声母的单词）
# none    不调整任何单词，相当于没有启用这个 Lua
# custom  自定义，只调整 words 里的
# 『留白』 不设置该选项，使用 reduce_english_filter 内全局设置内容
# （匹配的是编码，不是单词）
reduce_english_filter:
  mode: all  # all | none | custom | 『留白』
  idx: 2        # 调整到第 idx 个位置
  # 自定义的单词列表，示例列表没有调整部分常用单词，如 and cat mail Mac but bad shit ……
  words: [aid, ann,
  bail, bait, bam, band, bans, bat, bay, bend, bent, benz, bib, bid, bien, biz, boc, bop, bos, bud, buf,
  cab, cad, cain, cam, cans, cap, cas, cef, chad, chan, chap, chef, cher, chew, chic, chin, chip, chit, coup, cum, cunt, cur,
  dab, dag, dal, dam, dent, dew, dial, diet, dim, din, dip, dis, dit, doug, dub, dug, dunn,
  fab, fax, fob, fog, foul, fur,
  gag, gail, gain, gal, gam, gaol, ged, gel, ger, guam, gus, gut,
  hail, ham, hank, hans, hat, hay, heil, heir, hem, hep, hud, hum, hung, hunk, hut,
  jim, jug,
  kat,
  lab, lad, lag, laid, lam, laos, lap, lat, lax, lay, led, leg, lex, liam, lib, lid, lied, lien, lies, linn, lip, lit, liz, lob, lua, lug, lund, lung, lux,
  mag, maid, mann, mar, mat, med, mel, mend, mens, ment, mil, mins, mint, mob, moc, mop, mos, mot, mud, mug, mum, nail,
  nap, nat, nay, neil, nib, nip, noun, nous, nun, nut,
  pac, paid, pail, pain, pair, pak, pal, pam, pans, pant, pap, par, pat, paw, pax, pens, pic, pier, pies, pins, pint, pit, pix, pod, pop, pos, pot, pour, pow, pub,
  rand, rant, rent, rep, res, ret, rex, rib, rid, rig, rim, rub, rug, rum, runc, runs,
  sac, sail, sal, sam, sans, sap, saw, sax, sew, sham, shaw, shin, sig, sin, sip, sis, suit, sung, suns, sup, sur, sus,
  tad, tail, taj, tar, tax, tec, ted, tel, ter, tex, tic, tied, tier, ties, tim, tin, tit, tour, tout, tum,
  wag, wand, womens, wap, wax, weir, won,
  yan, yen]
  
# 中国农历配置（已禁用）
# chineseLunarCalendar_translator: lunar

# 手心小鹤独立码表配置（限定 abc 与 emoji 标签，避免干扰其他功能模式）
shouxin_flypy:
  dictionary: shouxin_flypy
  initial_quality: 10.0
  enable_sentence: false
  enable_user_dict: false
  enable_completion: false
  tags: [abc, emoji]

# 手心小鹤固定候选位与热加载配置
hot_slot_filter:
  file: dicts/flypy/shouxin_flypy.txt
  check_interval: 1
  deduplicate: true
  enable_comments: false

translator:
  # 字典文件
  dictionary: rime_mint          # 使用的字典文件
  prism: double_pinyin_flypy     # 多方案共用一个词库时，为避免冲突，需要用 prism 指定一个名字。
  spelling_hints: 8              # corrector.lua ：为了让错音错字提示的 Lua 同时适配全拼双拼，将拼音显示在 comment 中
  always_show_comments: true     # corrector.lua ：Rime 默认在 preedit 等于 comment 时取消显示 comment，这里强制一直显示，供 corrector.lua 做判断用。
  comment_format: {comment}      # 将注释以词典字符串形式完全暴露，通过super_preedit.lua完全接管，灵活配置。
  # 双拼输入直接显示敲击的编码，不转换为全拼
  preedit_format: []
  initial_quality: 1.2
  # 学习仅作用于普通 script_translator 候选；不改变方案、固定候选和功能模式的优先级。
  enable_user_dict: true         # 记录已选词的词频并用于后续调频
  enable_encoder: true           # 将连续上屏的词语自动编码，形成可复用的用户词
  enable_sentence: true          # 允许普通输入的组句候选参与学习
  encode_commit_history: true    # 将上屏历史写入用户词典，供后续候选命中

melt_eng:
  dictionary: melt_eng           # 英文词典
  enable_sentence: false         # 关闭自动造句
  enable_completion: false       # 关闭自动提示
  initial_quality: 0.8


# 中英混合词汇
cn_en:
  dictionary: ""
  user_dict: dicts/rime_ice.cn_en_flypy
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 0.5
  comment_format:
    - xform/^.+$//

# 人名词库配置（供 name_translator 查询与棱镜双拼解析）
name_corpus:
  dictionary: name_corpus
  prism: name_corpus
  enable_user_dict: false
  enable_completion: false
  enable_sentence: false

# 拼写设定
speller:
  # 如果不想让什么标点直接上屏，可以加在 alphabet，或者编辑标点符号为两个及以上的映射
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA;
  # initials 定义仅作为始码的按键，排除 ; 让单个的 ; 可以直接上屏
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " `"  # 第一位<空格>是拼音之间的分隔符；第二位<'>表示可以手动输入单引号来分割拼音。
  algebra:
    - xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜü/aaaaooooeeeeiiiiuuuuvvvvv/  # 万象词库 Start
    - xform/^ng$/eng/
    - xform/ńg|ňg|ǹg/eng/
    - xform/ń|ň|ǹ/en/                                            # 万象词库 End
    - erase/^xx$/
    - derive/^([jqxy])u$/$1v/
    - derive/^([aoe])([ioun])$/$1$1$2/
    - xform/^([aoe])(ng)?$/$1$1$2/
    - xform/iu$/Ⓠ/
    - xform/(.)ei$/$1Ⓦ/
    - xform/uan$/Ⓡ/
    - xform/[uv]e$/Ⓣ/
    - xform/un$/Ⓨ/
    - xform/^sh/Ⓤ/
    - xform/^ch/Ⓘ/
    - xform/^zh/Ⓥ/
    - xform/uo$/Ⓞ/
    - xform/ie$/Ⓟ/
    - xform/(.)i?ong$/$1Ⓢ/
    - xform/ing$|uai$/Ⓚ/
    - xform/(.)ai$/$1Ⓓ/
    - xform/(.)en$/$1Ⓕ/
    - xform/(.)eng$/$1Ⓖ/
    - xform/[iu]ang$/Ⓛ/
    - xform/(.)ang$/$1Ⓗ/
    - xform/ian$/Ⓜ/
    - xform/(.)an$/$1Ⓙ/
    - xform/(.)ou$/$1Ⓩ/
    - xform/[iu]a$/Ⓧ/
    - xform/iao$/Ⓝ/
    - xform/(.)ao$/$1Ⓒ/
    - xform/ui$/Ⓥ/
    - xform/in$/Ⓑ/
    - xlit/ⓆⓌⓇⓉⓎⓊⒾⓄⓅⓈⒹⒻⒼⒽⒿⓀⓁⓏⓍⒸⓋⒷⓃⓂ/qwrtyuiopsdfghjklzxcvbnm/
    - abbrev/^(.).+$/$1/  # 首字母简拼，开启后会导致 3 个字母时 kj'x 变成 k'jx 的问题

# wubi98_mint:

stroke:
  tag: stroke
  dictionary: stroke
  enable_user_dict: false
  prefix: 'Ui'
  tips: 〔笔画〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/

radical_reverse_lookup:
  tag: radical_lookup
  dictionary: radical_pinyin
  prism: flypy_radical_pinyin
  enable_completion: false
  enable_sentence: false
  prefix: "U"
  # comment_format:
  #   - erase/^.*$// # 删除注释
  tips: 〔拆字〕

reverse_lookup:
  tags: [radical_lookup]
  overwrite_comment: true
  dictionary: rime_mint

punctuator:
  import_preset: symbols
  full_shape:
    ",": { commit: ， }
    ".": { commit: 。 }
    "=": { commit: "=" }
    "/": { commit: "、" }
    '\\': { commit: "、" }
    "|": { commit: "|" }
    '"': { pair: [ '「', '」' ] }
    "'": { pair: [ '『', '』' ] }
    "[": { commit: "【" }
    "]": { commit: "】" }
    "{": { commit: "〔" }
    "}": { commit: "〕" }
    "$": "¥"
    "%": "%"
    "<": { commit: "《" }
    ">": { commit: "》" }
  # 定义部分半角字符
  half_shape:
    "#": "#"
    "*": "*"
    ',': { commit: ， }
    '.': { commit: 。 }
    "`": "`"
    "~": "~"
    "@": "@"
    "=": { commit: "=" }
    "/": { commit: "、" }
    "|": { commit: "|" }
    '\\': { commit: "、" }
    "_" : "──"
    "'": { pair: [ '“', '”' ] }
    '"': { pair: [ '‘', '’' ] }
    "[": { commit: "【" }
    "]": { commit: "】" }
    "{": { commit: "〔" }
    "}": { commit: "〕" }
    "$": "¥"
    "%": "%"
    "<": { commit: "《" }
    ">": { commit: "》" }


# 反查映射
unicode:
  tag: unicode
  prefix: "Uc"
  tips: 〔Unicode〕

recognizer:
  import_preset: default
  patterns:
    emoji: "^B[a-z]*'?$"
    english_filter: "^E[a-z]*$"
    # unicode: "^Uc[a-z]*'?$"
    url: "^[a-z]+[.].+$"
    # punct: "^/([0-9]0?|[a-zA-Z]+)$" # 已关闭 / 引导符号，保证 / 和 | 直接输出
    # wubi98_mint: "Uw[a-z]*'?$"
    # stroke: "Ui[a-z]*'?$"
    radical_lookup: "^U[a-z]*'?$"    # 响应反查（u+Tab 触发）
    calc_or_number: "^V.*$"          # 响应 lua_translator@v_expression_translator（v+Tab 触发）
    date_calc: "^R.*$"               # 响应 lua_translator@date_calculator（r+Tab 触发）
    # rmb: "^[Rr][0-9]+[.]?[0-9]*"     # 已关闭：由 V 模式接管
    law_article: "^[Dd][0-9]+[.]?[0-9]*[.]?[0-9]*$"  # d12、d12.3、d12.3.1、d12..1
    law_unit: "^[Dd][0-9]+([vjkxytz]|zh)$"            # 章(v/z/zh)、节(j)、款(k)、项(x)、页(y)、条(t)
    # expression: "^=.*$"              # 已关闭 = 引导表达式计算，保证 = 直接输出
    # gregorian_to_lunar: "^N[0-9]{1,8}"  # 已禁用大写N日期公历转农历触发，统一由大写R接管
    lpr: "^L.*$"                     # 响应 lua_translator@lpr（lpr+Tab 触发）
    anyou: "^A.*$"                   # 响应 lua_translator@anyou（a+Tab 触发）
    zuiming: "^Z.*$"                 # 响应 lua_translator@zuiming（z+Tab 触发）
    fayuan: "^F.*$"                  # 响应 lua_translator@fayuan（f+Tab 触发）
    falv: "^G.*$"                   # 响应 lua_translator@falv（l+Tab 触发）
    fenshu: "^Ys.*$"                 # 响应 lua_translator@fenshu_translator（ys/yu+Tab 触发）
    history: "^H$"                   # 响应 lua_translator@repeat_history_translator（h+Tab 触发）
    uppercase: ""  # 覆写默认的 uppercase 使其可以在输入大写后，输入数字

anyou:
  tag: anyou
  pinyin_type: flypy
  tips: 〔民事案由筛选〕

zuiming:
  tag: zuiming
  pinyin_type: flypy
  tips: 〔刑法罪名筛选〕

fayuan:
  tag: fayuan
  pinyin_type: flypy
  tips: 〔人民法院筛选〕

legal_search:
  tag: legal_search
  pinyin_type: flypy
  tips: 〔法院·案由·罪名·法律综合检索〕

falv:

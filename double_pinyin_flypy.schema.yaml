# Tab 功能模式开关。enabled 为总开关；其余键对应实际输入的触发码。
# 在 *.custom.yaml 中覆盖为 false 即可关闭，无需删除处理器或翻译器。
tab_mode_switches:
  enabled: true
  english: true # e + Tab / Ctrl+Shift+E 英文补全
  e: true       # 兼容旧配置；英文模式由 english 开关控制
  f: true       # f + Tab / Ctrl+Shift+F 法律综合检索
  v: true       # v + Tab 或 V 数字、金额、计算器
  history: true  # h/i + Tab 输入历史与重复上次输出
  b: true       # Emoji 的 b + Tab 入口
  l: false      # 关闭 l + Tab 旧入口
  z: false      # 关闭 z + Tab 罪名入口
  a: false      # 关闭 a/ay + Tab 案由入口
  lpr: false    # 关闭 l/lpr + Tab LPR 入口
  r: false      # 关闭 r/rq + Tab 日期入口
  rf: false     # 关闭 rf + Tab 法定顺延入口
  u: true       # u + Tab 拆字入口
  ys: false     # 关闭 ys/yu + Tab 文本份数入口

# 候选窗默认显示实际键入的触发码；如需自定义，可按触发码覆盖：
# tab_mode_display:
#   l: law
#   z: crime

date_calc:
  tag: date_calc
  tips: 〔日期及计算〕

calc_or_number:
  tag: calc_or_number
  tips: 〔数字/金额/计算器〕

history:
  tag: history
  tips: 〔输入历史〕


key_binder:
  import_preset: default
  # Lua 配置: shijian.lua 的引导符（已禁用）
  # shijian_keys: ["o"]
  bindings:
    # Ctrl+Shift+T 由 transcription_hotkey 统一处理，避免重复切换和抬键泄漏。
    # Ctrl+Shift+M 由 name_mode_hotkey 统一处理，避免重复切换和抬键泄漏。
    - {accept: "Control+Shift+M", toggle: name_mode, when: has_menu}               # 人名模式开关（快捷键兜底）
    - {accept: "Control+Shift+m", toggle: name_mode, when: has_menu}               # 兼容小狼毫将 Shift+M 读取为小写 m
    - {accept: "Control+Shift+C", toggle: chaifen, when: has_menu}                 # 拆字滤镜开关
    - {accept: "Control+Shift+c", toggle: chaifen, when: has_menu}                 # 兼容小狼毫将 Shift+C 读取为小写 c
    - {accept: semicolon, send: 2, when: has_menu}                                 # 分号选择第二候选
    - {accept: apostrophe, send: 3, when: has_menu}                                # 单引号选择第三候选
    
menu:
  # 候选词个数
  page_size: 5

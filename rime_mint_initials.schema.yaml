# Rime schema
# encoding: utf-8

# 该依赖方案用于让 Rime 部署器编译 rime_mint_initials.dict.yaml。
# 无需加入 schema_list；实际输入由 double_pinyin_flypy 调用其 table_translator。
schema:
  schema_id: rime_mint_initials
  name: "纯小鹤首拼词库（依赖）"
  version: "2026-09-23"

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  initials: zyxwvutsrqponmlkjihgfedcba

translator:
  dictionary: rime_mint_initials
  enable_user_dict: true
  enable_completion: false
  enable_sentence: false
